# admin-web 接入共享 nginx 的服务配置（#95）——安装为 infra 的 conf.d/admin-web.conf，
# 唯一合法通道是门禁：./install-nginx-conf.sh admin-web <本文件> <证书源目录>
# （证书源目录＝远端应用部署单元内 deploy/certs/，沿用证书商原文件名
#  admin.semgravio.com_bundle.pem / admin.semgravio.com.key，无需改名；
#  门禁复制进 infra 的 nginx/certs/admin-web/，本 conf 引用容器内挂载路径）。
#
# 路由（唯一对外入口 https://admin.semgravio.com）：
#   80  → 301 统一跳转 HTTPS；443 → TLS 终止 → 反代 semgravio-admin-web:80
#         （应用容器内 nginx：SPA 静态产物 + /api/admin/** 同源反代 admin BFF，BACKEND_URL 启动注入）。
#
# 契约约束（门禁强制）：不得声明 default_server（归 infra 兜底 server）；server_name
# 单行书写（撞车检测按单行抽取）；证书/私钥只引用自己名下 certs/admin-web/。
#
# Docker 内置 DNS：按容器名解析上游。valid=5s——应用容器重建换新 IP 后最迟 5s 重解析，
# 消掉「上游已就绪、路由仍指旧 IP」的 502 窗口；proxy_pass 用变量形式（set $upstream_app）
# 才会走 resolver。与 aiplatform.conf 各自声明（infra nginx ≥1.30 支持同 http 块多 resolver）。
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name admin.semgravio.com;
    # 统一跳转 HTTPS，保留原始 URI 与查询串
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.semgravio.com;

    ssl_certificate     /etc/nginx/certs/admin-web/admin.semgravio.com_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/admin-web/admin.semgravio.com.key;

    client_max_body_size 20m;

    location / {
        set $upstream_app semgravio-admin-web;
        proxy_pass http://$upstream_app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BFF 可能有长连接/SSE 类响应：不扣流、拉长读超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
